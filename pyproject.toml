[project]
name = "quant-lab"
version = "0.1.0"
description = "A-share research lab: point-in-time universe cleaning"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "tushare>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "factors*", "strategy*", "backtest*", "ptrade*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
